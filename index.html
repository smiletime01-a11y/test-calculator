<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>成績計算器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
    background: #f0f6ff;
    color: #1a1a1a;
    max-width: 480px;
    margin: 0 auto;
    padding-bottom: 40px;
  }

  .hdr {
    background: #2563a8;
    padding: 18px 18px 15px;
    text-align: center;
  }
  .hdr h1 { font-size: 21px; font-weight: 700; color: #fff; letter-spacing: 0.06em; }

  /* 欄位標頭 */
  .col-head {
    display: grid;
    grid-template-columns: 1fr 64px 80px 72px;
    gap: 6px;
    padding: 8px 16px 4px;
    margin: 14px 12px 0;
  }
  .col-head span {
    font-size: 11px;
    color: #7aaad8;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-align: center;
  }
  .col-head span:first-child { text-align: left; }

  /* 科目列表 */
  .card {
    background: #fff;
    border-radius: 16px;
    margin: 4px 12px 0;
    overflow: hidden;
    box-shadow: 0 1px 8px rgba(37,99,168,0.09);
  }

  .row {
    display: grid;
    grid-template-columns: 1fr 64px 80px 72px;
    align-items: center;
    padding: 0 16px;
    height: 58px;
    gap: 6px;
    border-bottom: 1px solid #edf3fb;
  }
  .row:last-child { border-bottom: none; }

  .rname {
    font-size: 18px;
    font-weight: 600;
    color: #1a3a5c;
  }
  .rbadge {
    font-size: 13px;
    color: #5a99d0;
    background: #e4f0fb;
    border-radius: 6px;
    padding: 3px 0;
    font-weight: 500;
    text-align: center;
  }
  .rinput {
    width: 100%;
    border: 2px solid #c0d8ee;
    border-radius: 10px;
    font-size: 21px;
    font-family: inherit;
    font-weight: 700;
    color: #1a3a5c;
    text-align: center;
    padding: 6px 2px;
    background: #f4f9ff;
    outline: none;
    -moz-appearance: textfield;
  }
  .rinput::-webkit-outer-spin-button,
  .rinput::-webkit-inner-spin-button { -webkit-appearance: none; }
  .rinput:focus { border-color: #2563a8; background: #fff; }
  .rinput.bad   { border-color: #e04040; background: #fff4f4; color: #c00; }

  .rwscore {
    font-size: 18px;
    font-weight: 700;
    color: #2563a8;
    text-align: center;
  }
  .rwscore.empty { color: #c8ddf0; }

  /* 總分區 */
  .totals {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 10px 12px 0;
  }
  .tot-item {
    background: #fff;
    border: 1.5px solid #c0d8ee;
    border-radius: 13px;
    padding: 11px 8px 10px;
    text-align: center;
    box-shadow: 0 1px 4px rgba(37,99,168,0.06);
  }
  .tot-label {
    font-size: 12px;
    color: #5a99d0;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-bottom: 4px;
  }
  .tot-val {
    font-size: 26px;
    font-weight: 800;
    color: #1a3a5c;
    line-height: 1;
  }
  .tot-val.empty { color: #c8ddf0; }
  .tot-max {
    font-size: 13px;
    color: #aac4dc;
    font-weight: 500;
    margin-left: 2px;
  }

  /* 結果區 */
  .results {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 10px 12px 0;
  }

  .res-card {
    border-radius: 16px;
    padding: 16px 10px 15px;
    text-align: center;
    box-shadow: 0 1px 8px rgba(37,99,168,0.09);
  }
  .res-card.weighted   { background: #2563a8; }
  .res-card.unweighted { background: #fff; border: 1.5px solid #c0d8ee; }

  .res-title {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
  }
  .weighted   .res-title { color: rgba(255,255,255,0.7); }
  .unweighted .res-title { color: #5a99d0; }

  .res-num {
    font-size: 52px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.01em;
  }
  .weighted   .res-num      { color: #fff; }
  .weighted   .res-num.pass { color: #5df0b0; }
  .weighted   .res-num.fail { color: #ffaaaa; }
  .unweighted .res-num      { color: #1a3a5c; }
  .unweighted .res-num.pass { color: #148a5a; }
  .unweighted .res-num.fail { color: #cc3333; }

  .res-sub {
    font-size: 12px;
    margin-top: 6px;
  }
  .weighted   .res-sub { color: rgba(255,255,255,0.4); }
  .unweighted .res-sub { color: #aac4dc; }

  .clear-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 12px 12px 0;
    padding: 14px;
    background: #fff;
    border: 1.5px solid #c0d8ee;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 500;
    color: #7aaad8;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 0.05em;
    box-shadow: 0 1px 4px rgba(37,99,168,0.06);
  }
  .clear-btn:active { background: #e8f2fc; }

  .note {
    text-align: center;
    font-size: 12px;
    color: #a8c4dc;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="hdr">
  <h1>成績加權計算器</h1>
</div>

<div class="col-head">
  <span>科目</span>
  <span>權重</span>
  <span>分數</span>
  <span>加權分</span>
</div>

<div class="card" id="subjects"></div>

<div class="totals">
  <div class="tot-item">
    <div class="tot-label">加權總分</div>
    <div class="tot-val empty" id="w-sum">—<span class="tot-max">/1800</span></div>
  </div>
  <div class="tot-item">
    <div class="tot-label">總分</div>
    <div class="tot-val empty" id="u-sum">—<span class="tot-max">/700</span></div>
  </div>
</div>

<div class="results">
  <div class="res-card weighted">
    <div class="res-title">加權平均</div>
    <div class="res-num" id="w-avg">—</div>
    <div class="res-sub">總權重 18</div>
  </div>
  <div class="res-card unweighted">
    <div class="res-title">未加權平均</div>
    <div class="res-num" id="u-avg">—</div>
    <div class="res-sub">7 科算術平均</div>
  </div>
</div>

<button class="clear-btn" onclick="clearAll()">清除全部分數</button>
<div class="note">輸入 0–100，即時計算</div>

<script>
const S = [
  {name:"國文", w:5},
  {name:"英文", w:3},
  {name:"數學", w:4},
  {name:"歷史", w:1},
  {name:"地理", w:1},
  {name:"公民", w:1},
  {name:"生物", w:3},
];
const TW = S.reduce((a,s)=>a+s.w, 0);
const MAX_W = TW * 100;       // 加權滿分 = 1800
const MAX_U = S.length * 100; // 未加權滿分 = 700
let scores = Array(S.length).fill("");

function render() {
  document.getElementById("subjects").innerHTML = S.map((s,i) => {
    const n = parseFloat(scores[i]);
    const ws = (!isNaN(n) && scores[i] !== "") ? (n * s.w).toFixed(0) : "—";
    const wsClass = ws === "—" ? "rwscore empty" : "rwscore";
    return `<div class="row">
      <span class="rname">${s.name}</span>
      <span class="rbadge">×${s.w}</span>
      <input class="rinput" type="number" inputmode="decimal"
        min="0" max="100" step="1"
        value="${scores[i]}" placeholder="—"
        oninput="onScore(${i},this.value,this)">
      <span class="${wsClass}" id="ws-${i}">${ws}</span>
    </div>`;
  }).join("");
}

function calc() {
  let ws=0, wt=0, sum=0, cnt=0;
  scores.forEach((v,i) => {
    const n = parseFloat(v);
    if(!isNaN(n) && v !== "") { ws+=n*S[i].w; wt+=S[i].w; sum+=n; cnt++; }
  });
  const wEl    = document.getElementById("w-avg");
  const uEl    = document.getElementById("u-avg");
  const wSumEl = document.getElementById("w-sum");
  const uSumEl = document.getElementById("u-sum");

  if(cnt === 0) {
    wEl.textContent="—"; wEl.className="res-num";
    uEl.textContent="—"; uEl.className="res-num";
    wSumEl.innerHTML = `—<span class="tot-max">/${MAX_W}</span>`;
    wSumEl.className = "tot-val empty";
    uSumEl.innerHTML = `—<span class="tot-max">/${MAX_U}</span>`;
    uSumEl.className = "tot-val empty";
    return;
  }
  const wa=ws/wt, ua=sum/cnt;
  wEl.textContent = wa.toFixed(2);
  wEl.className   = "res-num " + (wa>=60 ? "pass" : "fail");
  uEl.textContent = ua.toFixed(2);
  uEl.className   = "res-num " + (ua>=60 ? "pass" : "fail");

  wSumEl.innerHTML = `${ws.toFixed(0)}<span class="tot-max">/${MAX_W}</span>`;
  wSumEl.className = "tot-val";
  uSumEl.innerHTML = `${sum.toFixed(0)}<span class="tot-max">/${MAX_U}</span>`;
  uSumEl.className = "tot-val";
}

function onScore(i, val, el) {
  const n = parseFloat(val);
  if(val !== "" && (isNaN(n) || n<0 || n>100)) { el.classList.add("bad"); return; }
  el.classList.remove("bad");
  scores[i] = val;
  // 即時更新該科加權分
  const wsEl = document.getElementById("ws-"+i);
  if(wsEl) {
    const ws = val !== "" ? (n * S[i].w).toFixed(0) : "—";
    wsEl.textContent = ws;
    wsEl.className = ws === "—" ? "rwscore empty" : "rwscore";
  }
  calc();
}

function clearAll() {
  scores = Array(S.length).fill("");
  render(); calc();
}

render();
calc();
</script>
</body>
</html>
